<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guitar World — 東京</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400&family=Space+Mono:wght@400;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --pink: #ff3fa4;
    --teal: #4fc4cf;
    --amber: #ffb347;
    --deep: #0a0612;
    --purple: #1a0d2e;
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--deep);
    font-family: 'Space Mono', monospace;
    cursor: none;
  }

  /* custom cursor */
  .cursor {
    position: fixed;
    width: 12px; height: 12px;
    background: var(--pink);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    mix-blend-mode: screen;
    transition: transform 0.1s ease;
    box-shadow: 0 0 20px var(--pink), 0 0 40px var(--pink);
  }

  /* BG image */
  .bg {
    position: fixed;
    inset: 0;
    background-image: url('IMAGE_2026-05-11_14_25_46.jpg');
    background-size: cover;
    background-position: center bottom;
    z-index: 0;
    filter: brightness(0.75) saturate(1.2);
    transform: scale(1.05);
    transition: filter 2s ease;
  }

  /* rain overlay */
  .rain-canvas {
    position: fixed;
    inset: 0;
    z-index: 1;
    opacity: 0.35;
    pointer-events: none;
  }

  /* vignette */
  .vignette {
    position: fixed;
    inset: 0;
    z-index: 2;
    background: radial-gradient(ellipse at center, transparent 30%, rgba(5,3,15,0.85) 100%);
    pointer-events: none;
  }

  /* scanlines */
  .scanlines {
    position: fixed;
    inset: 0;
    z-index: 3;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.08) 2px,
      rgba(0,0,0,0.08) 4px
    );
    pointer-events: none;
    animation: scanroll 8s linear infinite;
  }
  @keyframes scanroll {
    from { background-position: 0 0; }
    to   { background-position: 0 100%; }
  }

  /* ===== ENTRY SCREEN ===== */
  #entry {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(5,3,15,0.5);
    backdrop-filter: blur(2px);
    transition: opacity 1.5s ease;
  }

  .entry-kanji {
    font-family: 'Noto Serif JP', serif;
    font-size: clamp(60px, 12vw, 130px);
    color: rgba(255,255,255,0.08);
    letter-spacing: 0.3em;
    line-height: 1;
    margin-bottom: 32px;
    animation: kanji-flicker 4s ease-in-out infinite;
  }
  @keyframes kanji-flicker {
    0%,100% { opacity: 0.08; }
    50% { opacity: 0.14; }
  }

  .entry-title {
    font-size: clamp(11px, 2vw, 14px);
    letter-spacing: 0.5em;
    color: var(--teal);
    text-transform: uppercase;
    margin-bottom: 8px;
    opacity: 0.8;
  }

  .entry-sub {
    font-family: 'Noto Serif JP', serif;
    font-size: clamp(28px, 5vw, 52px);
    color: #fff;
    letter-spacing: 0.15em;
    text-shadow: 0 0 40px rgba(79,196,207,0.5);
    margin-bottom: 56px;
  }

  .enter-btn {
    position: relative;
    padding: 16px 48px;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    cursor: none;
    transition: all 0.3s ease;
    overflow: hidden;
  }
  .enter-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--pink);
    transform: translateX(-100%);
    transition: transform 0.4s ease;
    z-index: -1;
  }
  .enter-btn:hover::before { transform: translateX(0); }
  .enter-btn:hover {
    border-color: var(--pink);
    color: #fff;
    box-shadow: 0 0 30px rgba(255,63,164,0.4);
  }

  /* ===== MAIN UI ===== */
  #ui {
    position: fixed;
    inset: 0;
    z-index: 50;
    opacity: 0;
    pointer-events: none;
    transition: opacity 2s ease 0.5s;
  }
  #ui.visible {
    opacity: 1;
    pointer-events: all;
  }

  /* location tag top-left */
  .loc-tag {
    position: absolute;
    top: 40px; left: 48px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .loc-tag .num {
    font-size: 10px;
    letter-spacing: 0.4em;
    color: var(--pink);
    opacity: 0.8;
  }
  .loc-tag .city {
    font-family: 'Noto Serif JP', serif;
    font-size: clamp(22px, 4vw, 38px);
    color: #fff;
    letter-spacing: 0.1em;
    text-shadow: 0 0 30px rgba(79,196,207,0.6), 0 2px 20px rgba(0,0,0,0.8);
    line-height: 1;
  }
  .loc-tag .vibe {
    font-size: 10px;
    letter-spacing: 0.3em;
    color: var(--teal);
    opacity: 0.7;
    text-transform: uppercase;
  }

  /* neon sign top-right */
  .neon-sign {
    position: absolute;
    top: 40px; right: 48px;
    text-align: right;
    font-family: 'Noto Serif JP', serif;
    font-size: 13px;
    color: var(--pink);
    letter-spacing: 0.2em;
    line-height: 2;
    text-shadow: 0 0 10px var(--pink), 0 0 25px var(--pink);
    animation: neon-pulse 3s ease-in-out infinite;
  }
  @keyframes neon-pulse {
    0%,100% { text-shadow: 0 0 10px var(--pink), 0 0 25px var(--pink); opacity: 1; }
    50% { text-shadow: 0 0 6px var(--pink), 0 0 15px var(--pink); opacity: 0.85; }
  }

  /* bottom bar */
  .bottom-bar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 32px 48px;
    background: linear-gradient(to top, rgba(5,3,15,0.95) 0%, transparent 100%);
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
  }

  .skill-info {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-width: 420px;
  }
  .skill-label {
    font-size: 9px;
    letter-spacing: 0.5em;
    color: var(--teal);
    text-transform: uppercase;
    opacity: 0.6;
  }
  .skill-name {
    font-size: clamp(18px, 3vw, 26px);
    color: #fff;
    letter-spacing: 0.05em;
    opacity: 0.9;
  }
  .skill-desc {
    font-size: 10px;
    letter-spacing: 0.15em;
    color: rgba(255,255,255,0.4);
    line-height: 1.8;
    max-width: 360px;
  }

  /* player widget */
  .player {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;
    min-width: 200px;
  }
  .player-track {
    font-size: 9px;
    letter-spacing: 0.3em;
    color: rgba(255,255,255,0.35);
    text-transform: uppercase;
    text-align: right;
  }
  .player-controls {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .play-btn {
    width: 48px; height: 48px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.05);
    color: #fff;
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    cursor: none;
    transition: all 0.3s ease;
    backdrop-filter: blur(4px);
  }
  .play-btn:hover {
    border-color: var(--teal);
    background: rgba(79,196,207,0.15);
    box-shadow: 0 0 20px rgba(79,196,207,0.3);
  }
  .vol-slider {
    -webkit-appearance: none;
    width: 80px; height: 2px;
    background: rgba(255,255,255,0.15);
    outline: none;
    cursor: none;
  }
  .vol-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 10px; height: 10px;
    background: var(--teal);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--teal);
  }

  /* progress dots (lore unlocks) */
  .progress-dots {
    position: absolute;
    right: 48px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: center;
  }
  .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.2);
    transition: all 0.4s ease;
  }
  .dot.active {
    background: var(--teal);
    box-shadow: 0 0 10px var(--teal);
  }
  .dot.done {
    background: var(--pink);
    box-shadow: 0 0 8px var(--pink);
  }

  /* hidden yt iframe */
  #yt-player {
    position: fixed;
    width: 1px; height: 1px;
    top: -999px; left: -999px;
    opacity: 0;
    pointer-events: none;
  }

  /* ambient text overlay */
  .ambient-words {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 2s ease;
  }
  .ambient-words.show { opacity: 1; }
  .ambient-word {
    display: block;
    font-family: 'Noto Serif JP', serif;
    font-size: clamp(13px, 2vw, 18px);
    color: rgba(255,255,255,0.12);
    letter-spacing: 0.4em;
    line-height: 2.5;
    animation: word-drift 6s ease-in-out infinite;
  }
  .ambient-word:nth-child(2) { animation-delay: 2s; }
  .ambient-word:nth-child(3) { animation-delay: 4s; }
  @keyframes word-drift {
    0%,100% { opacity: 0.12; transform: translateY(0); }
    50% { opacity: 0.22; transform: translateY(-4px); }
  }
</style>
</head>
<body>

<div class="cursor" id="cursor"></div>

<div class="bg" id="bg"></div>
<canvas class="rain-canvas" id="rain"></canvas>
<div class="vignette"></div>
<div class="scanlines"></div>

<!-- Entry screen -->
<div id="entry">
  <div class="entry-kanji">夜の静けさ</div>
  <div class="entry-title">Guitar World — Location 02</div>
  <div class="entry-sub">東京 / Tokyo</div>
  <button class="enter-btn" id="enterBtn" onclick="enterTokyo()">▶ &nbsp; Enter</button>
</div>

<!-- Main UI -->
<div id="ui">
  <div class="loc-tag">
    <span class="num">02 / 10</span>
    <span class="city">東京</span>
    <span class="vibe">rain · neon · 2am</span>
  </div>

  <div class="neon-sign">
    夜の<br>静けさ
  </div>

  <div class="ambient-words show">
    <span class="ambient-word">三つの音で語る</span>
    <span class="ambient-word">reverb is silence speaking</span>
    <span class="ambient-word">chord melody</span>
  </div>

  <div class="progress-dots">
    <div class="dot active" title="Listen"></div>
    <div class="dot" title="Feel"></div>
    <div class="dot" title="Play"></div>
    <div class="dot" title="Legend"></div>
  </div>

  <div class="bottom-bar">
    <div class="skill-info">
      <span class="skill-label">Current Skill</span>
      <span class="skill-name">Lo-fi Chord Melody</span>
      <span class="skill-desc">три ноты · пространство · ревёрб<br>let silence be part of the song</span>
    </div>

    <div class="player">
      <div class="player-track">Now Playing</div>
      <div class="player-controls">
        <input type="range" class="vol-slider" id="volSlider" min="0" max="100" value="70" oninput="setVol(this.value)">
        <button class="play-btn" id="playBtn" onclick="togglePlay()">⏸</button>
      </div>
    </div>
  </div>
</div>

<!-- Hidden YouTube iframe -->
<iframe id="yt-player"
  src="about:blank"
  allow="autoplay"
  frameborder="0">
</iframe>

<script>
  // Cursor
  const cursor = document.getElementById('cursor');
  document.addEventListener('mousemove', e => {
    cursor.style.left = e.clientX + 'px';
    cursor.style.top  = e.clientY + 'px';
  });

  // Rain canvas
  const canvas = document.getElementById('rain');
  const ctx = canvas.getContext('2d');
  let drops = [];

  function initRain() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
    drops = Array.from({length: 160}, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      len: Math.random() * 18 + 8,
      speed: Math.random() * 3 + 2,
      op: Math.random() * 0.3 + 0.08,
    }));
  }

  function drawRain() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drops.forEach(d => {
      ctx.beginPath();
      ctx.strokeStyle = `rgba(180,200,255,${d.op})`;
      ctx.lineWidth = 0.7;
      ctx.moveTo(d.x, d.y);
      ctx.lineTo(d.x - 1, d.y + d.len);
      ctx.stroke();
      d.y += d.speed;
      if (d.y > canvas.height) {
        d.y = -d.len;
        d.x = Math.random() * canvas.width;
      }
    });
    requestAnimationFrame(drawRain);
  }

  initRain();
  drawRain();
  window.addEventListener('resize', initRain);

  // YouTube player via iframe API
  let ytPlayer = null;
  let playing  = false;
  const VIDEO_ID = '0Azb6_MshGA';

  function loadYT() {
    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);
  }

  window.onYouTubeIframeAPIReady = function() {
    ytPlayer = new YT.Player('yt-player', {
      videoId: VIDEO_ID,
      playerVars: {
        autoplay: 1,
        loop: 1,
        playlist: VIDEO_ID,
        controls: 0,
        iv_load_policy: 3,
        rel: 0,
      },
      events: {
        onReady: e => {
          e.target.setVolume(70);
          e.target.playVideo();
          playing = true;
        }
      }
    });
  };

  function togglePlay() {
    if (!ytPlayer) return;
    const btn = document.getElementById('playBtn');
    if (playing) {
      ytPlayer.pauseVideo();
      btn.textContent = '▶';
      playing = false;
    } else {
      ytPlayer.playVideo();
      btn.textContent = '⏸';
      playing = true;
    }
  }

  function setVol(v) {
    if (ytPlayer) ytPlayer.setVolume(parseInt(v));
  }

  function enterTokyo() {
    const entry = document.getElementById('entry');
    const ui    = document.getElementById('ui');
    entry.style.opacity = '0';
    setTimeout(() => {
      entry.style.display = 'none';
      ui.classList.add('visible');
    }, 1500);
    loadYT();
  }
</script>
</body>
</html>
