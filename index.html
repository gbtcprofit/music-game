<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guitar World — 東京</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400&family=Space+Mono:wght@400;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --pink: #ff3fa4;
    --teal: #4fc4cf;
    --amber: #ffb347;
    --deep: #0a0612;
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--deep);
    font-family: 'Space Mono', monospace;
    cursor: none;
  }

  .cursor {
    position: fixed;
    width: 12px; height: 12px;
    background: var(--pink);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    mix-blend-mode: screen;
    transition: transform 0.1s ease;
    box-shadow: 0 0 20px var(--pink), 0 0 40px var(--pink);
  }

  /* BG */
  .bg {
    position: fixed;
    inset: 0;
    z-index: 0;
  }
  .bg img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
  }

  /* Rain */
  .rain-canvas {
    position: fixed;
    inset: 0;
    z-index: 1;
    opacity: 0.35;
    pointer-events: none;
  }

  /* Vignette */
  .vignette {
    position: fixed;
    inset: 0;
    z-index: 2;
    background: radial-gradient(ellipse at center, transparent 30%, rgba(5,3,15,0.7) 100%);
    pointer-events: none;
  }

  /* Scanlines */
  .scanlines {
    position: fixed;
    inset: 0;
    z-index: 3;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.06) 2px,
      rgba(0,0,0,0.06) 4px
    );
    pointer-events: none;
    animation: scanroll 8s linear infinite;
  }
  @keyframes scanroll {
    from { background-position: 0 0; }
    to   { background-position: 0 100%; }
  }

  /* ===== WINDOW HOTSPOT ===== */
  #window-hotspot {
    position: fixed;
    /* координаты под картинку tokyo dark.jpeg */
    left: 76.2%;
    top: 7.3%;
    width: 18.5%;
    height: 27.3%;
    z-index: 10;
    cursor: none;
    border-radius: 2px;
    transition: background 0.8s ease, box-shadow 0.8s ease;
  }

  #window-hotspot:hover {
    outline: 1px solid rgba(255,180,70,0.15);
  }

  #window-hotspot.lit {
    background: radial-gradient(
      ellipse at 50% 40%,
      rgba(255, 190, 80, 0.72) 0%,
      rgba(255, 150, 40, 0.38) 45%,
      rgba(255, 100, 20, 0.10) 70%,
      transparent 100%
    );
    box-shadow:
      0 0 80px 20px rgba(255, 180, 60, 0.35),
      0 0 160px 40px rgba(255, 140, 30, 0.15);
  }

  /* свечение на мокром асфальте — отражение окна */
  #window-reflection {
    position: fixed;
    left: 74%;
    top: 62%;
    width: 22%;
    height: 18%;
    z-index: 10;
    pointer-events: none;
    opacity: 0;
    background: radial-gradient(
      ellipse at 50% 0%,
      rgba(255, 180, 60, 0.22) 0%,
      transparent 70%
    );
    transition: opacity 1.2s ease;
    transform: scaleY(-1);
    filter: blur(4px);
  }
  #window-reflection.lit { opacity: 1; }

  /* ===== ENTRY SCREEN ===== */
  #entry {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(5,3,15,0.55);
    backdrop-filter: blur(2px);
    transition: opacity 1.5s ease;
  }

  .entry-kanji {
    font-family: 'Noto Serif JP', serif;
    font-size: clamp(60px, 12vw, 130px);
    color: rgba(255,255,255,0.07);
    letter-spacing: 0.3em;
    line-height: 1;
    margin-bottom: 32px;
    animation: kanji-flicker 4s ease-in-out infinite;
  }
  @keyframes kanji-flicker {
    0%,100% { opacity: 0.07; }
    50% { opacity: 0.13; }
  }

  .entry-title {
    font-size: clamp(11px, 2vw, 13px);
    letter-spacing: 0.5em;
    color: var(--teal);
    text-transform: uppercase;
    margin-bottom: 8px;
    opacity: 0.7;
  }

  .entry-sub {
    font-family: 'Noto Serif JP', serif;
    font-size: clamp(28px, 5vw, 52px);
    color: #fff;
    letter-spacing: 0.15em;
    text-shadow: 0 0 40px rgba(79,196,207,0.4);
    margin-bottom: 56px;
  }

  .enter-btn {
    position: relative;
    padding: 16px 48px;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    cursor: none;
    transition: all 0.3s ease;
    overflow: hidden;
  }
  .enter-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--pink);
    transform: translateX(-100%);
    transition: transform 0.4s ease;
    z-index: -1;
  }
  .enter-btn:hover::before { transform: translateX(0); }
  .enter-btn:hover {
    border-color: var(--pink);
    box-shadow: 0 0 30px rgba(255,63,164,0.4);
  }

  /* ===== MAIN UI ===== */
  #ui {
    position: fixed;
    inset: 0;
    z-index: 50;
    opacity: 0;
    pointer-events: none;
    transition: opacity 2s ease 0.5s;
  }
  #ui.visible {
    opacity: 1;
    pointer-events: all;
  }

  .loc-tag {
    position: absolute;
    top: 40px; left: 48px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .loc-tag .num {
    font-size: 10px;
    letter-spacing: 0.4em;
    color: var(--pink);
    opacity: 0.8;
  }
  .loc-tag .city {
    font-family: 'Noto Serif JP', serif;
    font-size: clamp(22px, 4vw, 38px);
    color: #fff;
    letter-spacing: 0.1em;
    text-shadow: 0 0 30px rgba(79,196,207,0.5), 0 2px 20px rgba(0,0,0,0.8);
    line-height: 1;
  }
  .loc-tag .vibe {
    font-size: 10px;
    letter-spacing: 0.3em;
    color: var(--teal);
    opacity: 0.7;
    text-transform: uppercase;
  }

  .neon-sign {
    position: absolute;
    top: 40px; right: 48px;
    font-family: 'Noto Serif JP', serif;
    font-size: 13px;
    color: var(--pink);
    letter-spacing: 0.2em;
    line-height: 2;
    text-align: right;
    text-shadow: 0 0 10px var(--pink), 0 0 25px var(--pink);
    animation: neon-pulse 3s ease-in-out infinite;
  }
  @keyframes neon-pulse {
    0%,100% { text-shadow: 0 0 10px var(--pink), 0 0 25px var(--pink); opacity: 1; }
    50% { text-shadow: 0 0 6px var(--pink), 0 0 12px var(--pink); opacity: 0.8; }
  }

  /* hint */
  .hint {
    position: absolute;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    letter-spacing: 0.4em;
    color: rgba(255,255,255,0.25);
    text-transform: uppercase;
    animation: hint-fade 3s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes hint-fade {
    0%,100% { opacity: 0.25; }
    50% { opacity: 0.5; }
  }
  .hint.hidden { display: none; }
</style>
</head>
<body>

<div class="cursor" id="cursor"></div>

<div class="bg">
  <img src="tokyo dark.jpeg" alt="">
</div>
<canvas class="rain-canvas" id="rain"></canvas>
<div class="vignette"></div>
<div class="scanlines"></div>

<!-- кликабельное окно -->
<div id="window-hotspot"></div>
<!-- отражение в луже -->
<div id="window-reflection"></div>

<!-- Entry -->
<div id="entry">
  <div class="entry-kanji">夜の静けさ</div>
  <div class="entry-title">Guitar World — Location 02</div>
  <div class="entry-sub">東京 / Tokyo</div>
  <button class="enter-btn" onclick="enterTokyo()">▶ &nbsp; Enter</button>
</div>

<!-- UI -->
<div id="ui">
  <div class="loc-tag">
    <span class="num">02 / 10</span>
    <span class="city">東京</span>
    <span class="vibe">rain · neon · 2am</span>
  </div>
  <div class="neon-sign">夜の<br>静けさ</div>
  <div class="hint" id="hint">何かが起きる — click the dark</div>
</div>

<!-- Audio -->
<audio id="vocal-sample" src="music.mp3" loop></audio>

<script>
  // Cursor
  const cursor = document.getElementById('cursor');
  document.addEventListener('mousemove', e => {
    cursor.style.left = e.clientX + 'px';
    cursor.style.top  = e.clientY + 'px';
  });

  // Rain
  const canvas = document.getElementById('rain');
  const ctx = canvas.getContext('2d');
  let drops = [];

  function initRain() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
    drops = Array.from({length: 160}, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      len: Math.random() * 18 + 8,
      speed: Math.random() * 3 + 2,
      op: Math.random() * 0.3 + 0.08,
    }));
  }

  function drawRain() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drops.forEach(d => {
      ctx.beginPath();
      ctx.strokeStyle = `rgba(180,200,255,${d.op})`;
      ctx.lineWidth = 0.7;
      ctx.moveTo(d.x, d.y);
      ctx.lineTo(d.x - 1, d.y + d.len);
      ctx.stroke();
      d.y += d.speed;
      if (d.y > canvas.height) { d.y = -d.len; d.x = Math.random() * canvas.width; }
    });
    requestAnimationFrame(drawRain);
  }

  initRain();
  drawRain();
  window.addEventListener('resize', initRain);

  // Enter
  function enterTokyo() {
    const entry = document.getElementById('entry');
    const ui    = document.getElementById('ui');
    entry.style.opacity = '0';
    setTimeout(() => {
      entry.style.display = 'none';
      ui.classList.add('visible');
    }, 1500);
  }

  // Window click
  const hotspot    = document.getElementById('window-hotspot');
  const reflection = document.getElementById('window-reflection');
  const hint       = document.getElementById('hint');
  const audio      = document.getElementById('vocal-sample');
  let   windowLit  = false;

  hotspot.addEventListener('click', () => {
    windowLit = !windowLit;

    if (windowLit) {
      hotspot.classList.add('lit');
      reflection.classList.add('lit');
      hint.classList.add('hidden');
      audio.volume = 0;
      audio.play().catch(() => {});
      fadeIn(audio, 0, 0.75, 2000);
    } else {
      hotspot.classList.remove('lit');
      reflection.classList.remove('lit');
      fadeOut(audio, audio.volume, 0, 1500, () => { audio.pause(); audio.currentTime = 0; });
    }
  });

  function fadeIn(el, from, to, ms) {
    const step = (to - from) / (ms / 16);
    el.volume = from;
    const iv = setInterval(() => {
      el.volume = Math.min(to, el.volume + step);
      if (el.volume >= to) clearInterval(iv);
    }, 16);
  }

  function fadeOut(el, from, to, ms, cb) {
    const step = (from - to) / (ms / 16);
    const iv = setInterval(() => {
      el.volume = Math.max(to, el.volume - step);
      if (el.volume <= to) { clearInterval(iv); if (cb) cb(); }
    }, 16);
  }
</script>
</body>
</html>
