  /* rain overlay */
  .rain-canvas {
    position: fixed;
    inset: 0;
    z-index: 1;
    opacity: 0.75;
    pointer-events: none;
  }

  /* vignette */
  .vignette {
    position: fixed;
    inset: 0;
    z-index: 2;
    background: radial-gradient(ellipse at center, transparent 30%, rgba(5,3,15,0.85) 100%);
    pointer-events: none;
  }

  /* scanlines */
  .scanlines {
    position: fixed;
    inset: 0;
    z-index: 3;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.08) 2px,
      rgba(0,0,0,0.08) 4px
    );
    pointer-events: none;
    animation: scanroll 8s linear infinite;
  }
  @keyframes scanroll {
    from { background-position: 0 0; }
    to   { background-position: 0 100%; }
  }

  /* ===== ENTRY SCREEN ===== */
  #entry {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(5,3,15,0.5);
    backdrop-filter: blur(2px);
    transition: opacity 1.5s ease;
  }

  .entry-kanji {
    font-family: 'Noto Serif JP', serif;
    font-size: clamp(60px, 12vw, 130px);
    color: rgba(255,255,255,0.08);
    letter-spacing: 0.3em;
    line-height: 1;
    margin-bottom: 32px;
    animation: kanji-flicker 4s ease-in-out infinite;
  }
  @keyframes kanji-flicker {
    0%,100% { opacity: 0.08; }
    50% { opacity: 0.14; }
  }

  .entry-title {
    font-size: clamp(11px, 2vw, 14px);
    letter-spacing: 0.5em;
    color: var(--teal);
    text-transform: uppercase;
    margin-bottom: 8px;
    opacity: 0.8;
  }

  .entry-sub {
    font-family: 'Noto Serif JP', serif;
    font-size: clamp(28px, 5vw, 52px);
    color: #fff;
    letter-spacing: 0.15em;
    text-shadow: 0 0 40px rgba(79,196,207,0.5);
    margin-bottom: 56px;
  }

  .enter-btn {
    position: relative;
    padding: 16px 48px;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    cursor: none;
    transition: all 0.3s ease;
    overflow: hidden;
  }
  .enter-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--pink);
    transform: translateX(-100%);
    transition: transform 0.4s ease;
    z-index: -1;
  }
  .enter-btn:hover::before { transform: translateX(0); }
  .enter-btn:hover {
    border-color: var(--pink);
    color: #fff;
    box-shadow: 0 0 30px rgba(255,63,164,0.4);
  }

  /* ===== MAIN UI ===== */
  #ui {
    position: fixed;
    inset: 0;
    z-index: 50;
    opacity: 0;
    pointer-events: none;
    transition: opacity 2s ease 0.5s;
  }
  #ui.visible {
    opacity: 1;
    pointer-events: all;
  }

  /* location tag top-left */
  .loc-tag {
    position: absolute;
    top: 40px; left: 48px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .loc-tag .num {
    font-size: 10px;
    letter-spacing: 0.4em;
    color: var(--pink);
    opacity: 0.8;
  }
  .loc-tag .city {
    font-family: 'Noto Serif JP', serif;
    font-size: clamp(22px, 4vw, 38px);
    color: #fff;
    letter-spacing: 0.1em;
    text-shadow: 0 0 30px rgba(79,196,207,0.6), 0 2px 20px rgba(0,0,0,0.8);
    line-height: 1;
  }
  .loc-tag .vibe {
    font-size: 10px;
    letter-spacing: 0.3em;
    color: var(--teal);
    opacity: 0.7;
    text-transform: uppercase;
  }

  /* neon sign top-right */
  .neon-sign {
    position: absolute;
    top: 40px; right: 48px;
    text-align: right;
    font-family: 'Noto Serif JP', serif;
    font-size: 13px;
    color: var(--pink);
    letter-spacing: 0.2em;
    line-height: 2;
    text-shadow: 0 0 10px var(--pink), 0 0 25px var(--pink);
    animation: neon-pulse 3s ease-in-out infinite;
    z-index: 10;
  }
  /* soft glow blob behind the neon sign */
  .neon-sign::before {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 160px;
    height: 200px;
    background: radial-gradient(ellipse at center,
      rgba(255, 63, 164, 0.28) 0%,
      rgba(255, 63, 164, 0.10) 40%,
      transparent 70%
    );
    filter: blur(18px);
    border-radius: 50%;
    z-index: -1;
    animation: glow-breathe 3s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes neon-pulse {
    0%,100% { text-shadow: 0 0 10px var(--pink), 0 0 25px var(--pink); opacity: 1; }
    50% { text-shadow: 0 0 6px var(--pink), 0 0 15px var(--pink); opacity: 0.85; }
  }
  @keyframes glow-breathe {
    0%,100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    50%      { opacity: 0.6; transform: translate(-50%, -50%) scale(0.88); }
  }

  /* bottom bar */
  .bottom-bar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 32px 48px;
    background: linear-gradient(to top, rgba(5,3,15,0.95) 0%, transparent 100%);
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
  }

  .skill-info {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-width: 420px;
  }
  .skill-label {
    font-size: 9px;
    letter-spacing: 0.5em;
    color: var(--teal);
    text-transform: uppercase;
    opacity: 0.6;
  }
  .skill-name {
    font-size: clamp(18px, 3vw, 26px);
    color: #fff;
    letter-spacing: 0.05em;
    opacity: 0.9;
  }
  .skill-desc {
    font-size: 10px;
    letter-spacing: 0.15em;
    color: rgba(255,255,255,0.4);
    line-height: 1.8;
    max-width: 360px;
  }

  /* player widget */
  .player {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;
    min-width: 200px;
  }
  .player-track {
    font-size: 9px;
    letter-spacing: 0.3em;
    color: rgba(255,255,255,0.35);
    text-transform: uppercase;
    text-align: right;
  }
  .player-controls {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .play-btn {
    width: 48px; height: 48px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.05);
    color: #fff;
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    cursor: none;
    transition: all 0.3s ease;
    backdrop-filter: blur(4px);
  }
  .play-btn:hover {
    border-color: var(--teal);
    background: rgba(79,196,207,0.15);
    box-shadow: 0 0 20px rgba(79,196,207,0.3);
  }
  .vol-slider {
    -webkit-appearance: none;
    width: 80px; height: 2px;
    background: rgba(255,255,255,0.15);
    outline: none;
    cursor: none;
  }
  .vol-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 10px; height: 10px;
    background: var(--teal);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--teal);
  }

  /* progress dots (lore unlocks) */
  .progress-dots {
    position: absolute;
    right: 48px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: center;
  }
  .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.2);
    transition: all 0.4s ease;
  }
  .dot.active {
    background: var(--teal);
    box-shadow: 0 0 10px var(--teal);
  }
  .dot.done {
    background: var(--pink);
    box-shadow: 0 0 8px var(--pink);
  }

  /* hidden yt iframe */
  #yt-player {
    position: fixed;
    width: 1px; height: 1px;
    top: -999px; left: -999px;
    opacity: 0;
    pointer-events: none;
  }

  /* ambient text overlay */
  .ambient-words {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 2s ease;
  }
  .ambient-words.show { opacity: 1; }
  .ambient-word {
    display: block;
    font-family: 'Noto Serif JP', serif;
    font-size: clamp(13px, 2vw, 18px);
    color: rgba(255,255,255,0.12);
    letter-spacing: 0.4em;
    line-height: 2.5;
    animation: word-drift 6s ease-in-out infinite;
  }
  .ambient-word:nth-child(2) { animation-delay: 2s; }
  .ambient-word:nth-child(3) { animation-delay: 4s; }
  @keyframes word-drift {
    0%,100% { opacity: 0.12; transform: translateY(0); }
    50% { opacity: 0.22; transform: translateY(-4px); }
  }

  /* parallax layer */
  .bg {
    will-change: transform;
    transition: transform 0.1s ease-out;
  }

  /* window glow overlays - positioned to match the image windows */
  .window-glow {
    position: fixed;
    pointer-events: none;
    z-index: 1;
    border-radius: 2px;
    mix-blend-mode: screen;
    animation: win-flicker 4s ease-in-out infinite;
  }
  .window-glow.w1 { top: 8%; right: 4%; width: 13%; height: 18%; background: radial-gradient(ellipse, rgba(255,180,80,0.18) 0%, transparent 70%); animation-delay: 0s; }
  .window-glow.w2 { top: 12%; right: 6%; width: 8%; height: 10%; background: radial-gradient(ellipse, rgba(255,160,60,0.12) 0%, transparent 70%); animation-delay: 1.3s; }
  .window-glow.w3 { top: 30%; left: 32%; width: 6%; height: 8%; background: radial-gradient(ellipse, rgba(255,170,70,0.1) 0%, transparent 70%); animation-delay: 2.1s; }
  .window-glow.w4 { top: 35%; right: 20%; width: 5%; height: 7%; background: radial-gradient(ellipse, rgba(255,160,60,0.09) 0%, transparent 70%); animation-delay: 0.7s; }
  @keyframes win-flicker {
    0%,100% { opacity: 1; }
    25% { opacity: 0.7; }
    50% { opacity: 1; }
    75% { opacity: 0.85; }
  }

  /* puddle neon reflection shimmer */
  .puddle-shimmer {
    position: fixed;
    bottom: 18%;
    left: 30%;
    width: 40%;
    height: 25%;
    pointer-events: none;
    z-index: 1;
    background: radial-gradient(ellipse at 40% 60%,
      rgba(255,63,164,0.08) 0%,
      rgba(255,63,164,0.04) 30%,
      transparent 65%
    );
    animation: puddle-wave 3s ease-in-out infinite;
    mix-blend-mode: screen;
  }
  @keyframes puddle-wave {
    0%,100% { transform: scaleX(1) scaleY(1); opacity: 1; }
    33% { transform: scaleX(1.04) scaleY(0.97); opacity: 0.7; }
    66% { transform: scaleX(0.97) scaleY(1.03); opacity: 0.9; }
  }

</style>
</head>
<body>

<div class="cursor" id="cursor"></div>

<div class="bg" id="bg"></div>

<!-- window glows -->
<div class="window-glow w1"></div>
<div class="window-glow w2"></div>
<div class="window-glow w3"></div>
<div class="window-glow w4"></div>
<!-- puddle shimmer -->
<div class="puddle-shimmer"></div>

<canvas class="rain-canvas" id="rain"></canvas>
<div class="vignette"></div>
<div class="scanlines"></div>

<!-- Entry screen -->
<div id="entry">
  <div class="entry-kanji">夜の静けさ</div>
  <div class="entry-title">Guitar World — Location 02</div>
  <div class="entry-sub">東京 / Tokyo</div>
  <button class="enter-btn" id="enterBtn" onclick="enterTokyo()">▶ &nbsp; Enter</button>
</div>

<!-- Main UI -->
<div id="ui">
  <div class="loc-tag">
    <span class="num">02 / 10</span>
    <span class="city">東京</span>
    <span class="vibe">rain · neon · 2am</span>
  </div>

  <div class="neon-sign">
    夜の<br>静けさ
  </div>

  <div class="ambient-words show">
    <span class="ambient-word">三つの音で語る</span>
    <span class="ambient-word">reverb is silence speaking</span>
    <span class="ambient-word">chord melody</span>
  </div>

  <div class="progress-dots">
    <div class="dot active" title="Listen"></div>
    <div class="dot" title="Feel"></div>
    <div class="dot" title="Play"></div>
    <div class="dot" title="Legend"></div>
  </div>

  <div class="bottom-bar">
    <div class="skill-info">
      <span class="skill-label">Current Skill</span>
      <span class="skill-name">Lo-fi Chord Melody</span>
      <span class="skill-desc">три ноты · пространство · ревёрб<br>let silence be part of the song</span>
    </div>

    <div class="player">
      <div class="player-track">Now Playing</div>
      <div class="player-controls">
        <input type="range" class="vol-slider" id="volSlider" min="0" max="100" value="70" oninput="setVol(this.value)">
        <button class="play-btn" id="playBtn" onclick="togglePlay()">⏸</button>
      </div>
    </div>
  </div>
</div>

<!-- Hidden YouTube iframe -->
<audio id="bg-music" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
  // Cursor
  const cursor = document.getElementById('cursor');
  document.addEventListener('mousemove', e => {
    cursor.style.left = e.clientX + 'px';
    cursor.style.top  = e.clientY + 'px';
  });


  // Parallax on mouse move
  const bg = document.getElementById('bg');
  document.addEventListener('mousemove', e => {
    const mx = (e.clientX / window.innerWidth  - 0.5) * 18;
    const my = (e.clientY / window.innerHeight - 0.5) * 10;
    bg.style.transform = `scale(1.05) translate(${mx}px, ${my}px)`;
  });

  // Rain canvas
  const canvas = document.getElementById('rain');
  const ctx = canvas.getContext('2d');
  let drops = [];

  function initRain() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
    drops = Array.from({length: 350}, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      len: Math.random() * 22 + 10,
      speed: Math.random() * 4 + 3,
      op: Math.random() * 0.45 + 0.15,
      w: Math.random() < 0.3 ? 1.2 : 0.7,
    }));
  }

  function drawRain() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drops.forEach(d => {
      ctx.beginPath();
      ctx.strokeStyle = `rgba(190,210,255,${d.op})`;
      ctx.lineWidth = d.w;
      ctx.moveTo(d.x, d.y);
      ctx.lineTo(d.x - 1.5, d.y + d.len);
      ctx.stroke();
      d.y += d.speed;
      if (d.y > canvas.height) {
        d.y = -d.len;
        d.x = Math.random() * canvas.width;
      }
    });
    requestAnimationFrame(drawRain);
  }

  initRain();
  drawRain();
  window.addEventListener('resize', initRain);

  // YouTube player via iframe API
  const music = document.getElementById('bg-music');

function enterTokyo() {
  const entry = document.getElementById('entry');
  const ui = document.getElementById('ui');

  entry.style.opacity = '0';

  setTimeout(() => {
    entry.style.display = 'none';
    ui.classList.add('visible');
  }, 1500);

  music.volume = 0.7;
  music.play();
}

function togglePlay() {
  const btn = document.getElementById('playBtn');

  if (music.paused) {
    music.play();
    btn.textContent = '⏸';
  } else {
    music.pause();
    btn.textContent = '▶';
  }
}

function setVol(v) {
  music.volume = v / 100;
}
</script>
</body>
</html>
